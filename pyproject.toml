[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["reports", ".tmp", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"integration/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["gateway", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_incomplete_defs = true
explicit_package_bases = true
mypy_path = "scripts"
