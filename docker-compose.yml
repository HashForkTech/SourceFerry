name: sourceferry

services:
  gateway:
    build:
      context: ./gateway
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    environment:
      LOCAL_WEB_API_TOKEN: ${LOCAL_WEB_API_TOKEN:?Run the setup script to create .env first}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Run the setup script to create .env first}
      SEARXNG_URL: http://searxng:8080
      CRAWL4AI_URL: http://crawl4ai:11235
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-120}
      CRAWL4AI_TIMEOUT_SECONDS: ${CRAWL4AI_TIMEOUT_SECONDS:-120}
      ENRICHMENT_CONCURRENCY: ${ENRICHMENT_CONCURRENCY:-4}
      SNIPPET_MAX_CHARS: ${SNIPPET_MAX_CHARS:-1200}
      GATEWAY_MAX_REQUESTS: ${GATEWAY_MAX_REQUESTS:-8}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      MAX_UPSTREAM_BYTES: ${MAX_UPSTREAM_BYTES:-8388608}
      SNIPPET_INPUT_MAX_CHARS: ${SNIPPET_INPUT_MAX_CHARS:-65536}
      REQUEST_DEADLINE_SECONDS: ${REQUEST_DEADLINE_SECONDS:-300}
    ports:
      - target: 8080
        published: "${GATEWAY_PORT:-8080}"
        host_ip: "${GATEWAY_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: ${SEARXNG_IMAGE:-ghcr.io/searxng/searxng:2026.10.7-6671d89be@sha256:cc026dbee25b864d7f9731957cd5ef36ba2e2d61abd2996d57f1b863483e7409}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:?Run the setup script to create .env first}
      FORCE_OWNERSHIP: "false"
    volumes:
      - type: bind
        source: ./searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6
    logging: *logging

  crawl4ai:
    build:
      context: ./crawler
      args:
        CRAWL4AI_IMAGE: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.4@sha256:9021b3cb5c6f12570bbcd5395638495e0a06969b3148e377b953d174af2ebc9b}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 512
    shm_size: "1gb"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Run the setup script to create .env first}
      CRAWL4AI_ALLOW_INTERNAL_URLS: "false"
      CRAWL4AI_ALLOW_INSECURE_TLS: "false"
      CRAWL4AI_HOOKS_ENABLED: "false"
    # The official image supplies an HTTP /health check.
    logging: *logging
